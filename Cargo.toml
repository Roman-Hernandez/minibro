[package]
name = "minibro"
version = "0.1.0"
edition = "2024"
authors = ["Roman Hernandez"]
description = "Ultra-lightweight desktop notch assistant"
license = "MIT"
repository = "https://github.com/Roman-Hernandez/minibro"

[features]
default = ["wayland"]
wayland = ["dep:iced_exwlshell"]

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas", "tokio"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
getrandom = "0.3"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSEnumerator"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFUUID", "CFString"] }

[target.'cfg(target_os = "linux")'.dependencies]
iced_exwlshell = { version = "0.21.0-rc3", optional = true }
